<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--rule)}.lbl{font-size:11px;color:var(--text-secondary);line-height:1.4}.lbl b{display:block;color:var(--text-primary);font-weight:500;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--charcoal-900)"></div><div class="lbl"><b>charcoal-900</b>#202321 text-primary</div></div><div class="sw"><div class="chip" style="background:var(--charcoal-700)"></div><div class="lbl"><b>charcoal-700</b>#3A3E3B primary hover</div></div><div class="sw"><div class="chip" style="background:var(--charcoal-500)"></div><div class="lbl"><b>charcoal-500</b>#5F655F text-secondary</div></div><div class="sw"><div class="chip" style="background:var(--charcoal-300)"></div><div class="lbl"><b>charcoal-300</b>#9A9E97 pending state</div></div><div class="sw"><div class="chip" style="background:var(--charcoal-200)"></div><div class="lbl"><b>charcoal-200</b>#C9CBC3 muted on dark</div></div></div></body></html>
