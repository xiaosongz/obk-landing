<!-- @dsCard group="Effects" viewport="700x160" name="Borders, radius, shadow" subtitle="Hairlines do the work · square corners · no card shadows · 2px bronze accent rule" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--rule)}.lbl{font-size:11px;color:var(--text-secondary);line-height:1.4}.lbl b{display:block;color:var(--text-primary);font-weight:500;font-size:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-size:12px;color:var(--text-secondary)"><div style="border:1px solid var(--rule);background:var(--surface-card);padding:16px;height:96px">1px #DAD6CB<br>radius 0<br>no shadow</div><div style="border-left:2px solid var(--bronze-500);padding:6px 16px;height:96px">2px bronze<br>left rule<br>(notice, manager note)</div><div style="border:1px solid var(--bronze-500);background:var(--surface-card);padding:16px;height:96px">hover:<br>border → bronze</div><div style="background:var(--surface-card);box-shadow:var(--shadow-float);padding:16px;height:96px">floating only<br>0 12px 32px<br>rgba(32,35,33,.14)</div></div></body></html>
