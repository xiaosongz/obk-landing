<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--rule)}.lbl{font-size:11px;color:var(--text-secondary);line-height:1.4}.lbl b{display:block;color:var(--text-primary);font-weight:500;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bronze-700)"></div><div class="lbl"><b>bronze-700</b>#7E6340 text-accent (AA on ivory)</div></div><div class="sw"><div class="chip" style="background:var(--bronze-600)"></div><div class="lbl"><b>bronze-600</b>#8F7350 bronze button hover</div></div><div class="sw"><div class="chip" style="background:var(--bronze-500)"></div><div class="lbl"><b>bronze-500</b>#A28258 accent, focus ring</div></div><div class="sw"><div class="chip" style="background:var(--bronze-300)"></div><div class="lbl"><b>bronze-300</b>#C8B393</div></div><div class="sw"><div class="chip" style="background:var(--bronze-100)"></div><div class="lbl"><b>bronze-100</b>#EDE4D6 accent-soft</div></div></div></body></html>
