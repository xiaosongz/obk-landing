<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--rule)}.lbl{font-size:11px;color:var(--text-secondary);line-height:1.4}.lbl b{display:block;color:var(--text-primary);font-weight:500;font-size:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><figure><img src="../assets/illustrations/process-acquisition.png" style="width:100%;aspect-ratio:3/2;object-fit:cover;object-position:top;display:block;border:1px solid var(--rule)"><figcaption style="font-size:12px;color:var(--text-secondary);padding-top:8px;text-transform:capitalize">acquisition</figcaption></figure><figure><img src="../assets/illustrations/process-renovation.png" style="width:100%;aspect-ratio:3/2;object-fit:cover;object-position:top;display:block;border:1px solid var(--rule)"><figcaption style="font-size:12px;color:var(--text-secondary);padding-top:8px;text-transform:capitalize">renovation</figcaption></figure><figure><img src="../assets/illustrations/process-leasing.png" style="width:100%;aspect-ratio:3/2;object-fit:cover;object-position:top;display:block;border:1px solid var(--rule)"><figcaption style="font-size:12px;color:var(--text-secondary);padding-top:8px;text-transform:capitalize">leasing</figcaption></figure></div></body></html>
